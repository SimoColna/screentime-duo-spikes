# XcodeGen spec: `brew install xcodegen && xcodegen generate`
# Bundle ID, Team, App Group e container CloudKit si configurano in Config/Base.xcconfig.
name: DuoSpike

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: it

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DuoSpike:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        PRODUCT_NAME: DuoSpike
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Duo Spike
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Necessario perche' il link d'invito CloudKit apra l'app.
        CKSharingSupported: true
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        DuoAppGroupID: $(APP_GROUP_ID)
        DuoCloudKitContainerID: $(CLOUDKIT_CONTAINER_ID)
    entitlements:
      path: App/DuoSpike.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        com.apple.developer.icloud-container-identifiers:
          - $(CLOUDKIT_CONTAINER_ID)
        com.apple.developer.icloud-services:
          - CloudKit
        # Per le push silenziose di CKDatabaseSubscription.
        aps-environment: development
    dependencies:
      - target: DuoMonitor

  DuoMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Monitor
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).monitor
        PRODUCT_NAME: DuoMonitor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: DuoMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
        DuoAppGroupID: $(APP_GROUP_ID)
        DuoCloudKitContainerID: $(CLOUDKIT_CONTAINER_ID)
    entitlements:
      path: Monitor/DuoMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
        # Serve solo per l'esperimento "scrittura CloudKit diretta dall'estensione" (domanda 2).
        com.apple.developer.icloud-container-identifiers:
          - $(CLOUDKIT_CONTAINER_ID)
        com.apple.developer.icloud-services:
          - CloudKit

schemes:
  DuoSpike:
    build:
      targets:
        DuoSpike: all
        DuoMonitor: all
    run:
      config: Debug
    archive:
      config: Release
