# XcodeGen spec: `brew install xcodegen && xcodegen generate`
# Bundle ID, Team e App Group si configurano in Config/Base.xcconfig.
# Il backend di sync non e' qui: e' dietro il protocollo SyncService (App/Sync).
name: DuoSpike

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: it

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DuoSpike:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        PRODUCT_NAME: DuoSpike
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Duo Spike
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # BGAppRefreshTask per il sync in background (fallback domanda 2).
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        DuoAppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: App/DuoSpike.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - target: DuoMonitor

  DuoMonitor:
    type: app-extension
    platform: iOS
    sources:
      - Monitor
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).monitor
        PRODUCT_NAME: DuoMonitor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: DuoMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
        DuoAppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: Monitor/DuoMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)

schemes:
  DuoSpike:
    build:
      targets:
        DuoSpike: all
        DuoMonitor: all
    run:
      config: Debug
    archive:
      config: Release
