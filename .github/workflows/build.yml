name: Build (unsigned)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Build app + DeviceActivityMonitor extension (iphoneos, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project DuoSpike.xcodeproj \
            -scheme DuoSpike \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Check extension is embedded
        run: |
          APP=$(find build/DerivedData/Build/Products -maxdepth 3 -name 'DuoSpike.app' | head -1)
          ls -la "$APP/PlugIns"
          test -d "$APP/PlugIns/DuoMonitor.appex"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension' "$APP/PlugIns/DuoMonitor.appex/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :DuoAppGroupID' "$APP/Info.plist"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
